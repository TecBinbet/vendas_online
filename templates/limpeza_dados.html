<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>⚙️ Reset de Tabelas - TECBIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 p-2 text-white">
    <div class="max-w-4xl mx-auto bg-white text-gray-800 rounded-xl shadow-2xl overflow-hidden">
        <div class="bg-red-600 p-2 flex justify-between items-center">
            <div>
                <h2 class="text-2xl text-white flex items-center gap-2">⚠️ Zona de Perigo: Limpeza de Dados</h2>
                <p class="text-gray-100">Selecione as tabelas que deseja esvaziar (os índices serão mantidos).</p>
            </div>
            <a href="{{ url_for('parametros') }}" class="px-4 py-2 bg-white/20 hover:bg-white/40 text-white rounded-lg font-bold transition border border-white/30">
                ← Sair / Voltar
            </a>
        </div>

        <form method="POST" class="p-3">
            <div class="grid grid-cols-2 md:grid-cols-3 gap-2 mb-2">
                {% for tabela in disponiveis %}
                <label class="flex items-center gap-2 p-3 border rounded hover:bg-gray-50 cursor-pointer transition">
                    <input type="checkbox" name="tabelas" value="{{ tabela }}" class="w-5 h-5 text-red-600">
                    <span class="font-mono text-sm">{{ tabela }}</span>
                </label>
                {% endfor %}
            </div>

            <div class="bg-blue-50 p-2 rounded-lg mb-1">
                <h4 class="font-bold text-blue-800">🛡️ Tabelas Blindadas (Segurança do Sistema)</h4>
                <div class="flex flex-wrap gap-2 text-lg font-mono text-blue-600">
                    {% for b in blindadas %} <span class="bg-blue-100 px-2 py-1 rounded">{{ b }}</span> {% endfor %}
                </div>
            </div>

            <div class="border-t pt-2">
                <p class="text-sm text-gray-500 mb-1 uppercase font-bold">Confirmação Crítica</p>
                <div class="flex flex-col md:flex-row gap-4 items-center">
                    <input type="text" name="confirmacao_manual" placeholder="Digite EXECUTAR para confirmar" 
                           class="form-control border-2 border-red-500 p-3 rounded-lg flex-1 w-full text-center font-black">
                    
                    <button type="submit" onclick="return confirm('ATENÇÃO! Esta ação não pode ser desfeita. Deseja continuar?')"
                            class="bg-red-600 hover:bg-red-800 text-white font-bold py-3 px-8 rounded-lg shadow-lg w-full md:w-auto">
                        LIMPAR TABELAS SELECIONADAS
                    </button>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
