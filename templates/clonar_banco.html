<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clonar Banco de Dados</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">
    <div class="max-w-3xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">🗄️ Gerenciador de Instâncias (Clone)</h1>
                <p class="text-sm text-gray-500">Copie estruturas e dados para criar novas salas rapidamente.</p>
            </div>
            <a href="javascript:history.back()" class="text-blue-600 hover:underline font-bold">← Voltar</a>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6 border-t-4 border-indigo-600">
            
            <div class="mb-6">
                <label class="block text-sm font-bold text-gray-700 mb-2">1. Selecione o Banco de Origem</label>
                <select id="db_origem" onchange="carregarColecoes()" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    <option value="">-- Escolha um banco de dados --</option>
                    {% for db in bancos %}
                        <option value="{{ db }}">{{ db }}</option>
                    {% endfor %}
                </select>
            </div>

            <div id="container_colecoes" class="mb-6 hidden">
                <div class="flex justify-between items-end mb-2">
                    <label class="block text-sm font-bold text-gray-700">2. Tabelas a serem clonadas</label>
                    <button type="button" onclick="marcarTodas()" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-2 py-1 rounded font-semibold transition">Marcar Todas</button>
                </div>
                <div id="lista_colecoes" class="bg-gray-50 border border-gray-200 rounded-lg p-4 max-h-60 overflow-y-auto grid grid-cols-2 md:grid-cols-3 gap-3">
                    </div>
            </div>

            <div id="container_destino" class="mb-6 hidden">
                <label class="block text-sm font-bold text-gray-700 mb-2">3. Nome do Novo Banco de Dados</label>
                <input type="text" id="db_destino" placeholder="Ex: VendasOnLine_004" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition">
                <p class="text-xs text-gray-500 mt-1">Se o banco não existir, o sistema o criará automaticamente.</p>
            </div>

            <div id="container_botao" class="mt-8 hidden">
                <button id="btn_clonar" onclick="executarClone()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition transform active:scale-95 flex justify-center items-center gap-2">
                    <span>🚀 Iniciar Clonagem</span>
                </button>
            </div>

        </div>
    </div>

    <script>
        function carregarColecoes() {
            const dbNome = document.getElementById('db_origem').value;
            const containerCol = document.getElementById('container_colecoes');
            const listaCol = document.getElementById('lista_colecoes');
            const containerDest = document.getElementById('container_destino');
            const containerBtn = document.getElementById('container_botao');

            if (!dbNome) {
                containerCol.classList.add('hidden');
                containerDest.classList.add('hidden');
                containerBtn.classList.add('hidden');
                return;
            }

            listaCol.innerHTML = '<div class="col-span-full text-center text-gray-500 text-sm py-4">⏳ Carregando tabelas...</div>';
            containerCol.classList.remove('hidden');

            fetch(`/api/colecoes_banco/${dbNome}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        listaCol.innerHTML = '';
                        if (data.colecoes.length === 0) {
                            listaCol.innerHTML = '<div class="col-span-full text-red-500 text-sm">Nenhuma tabela encontrada neste banco.</div>';
                            return;
                        }
                        data.colecoes.forEach(col => {
                            listaCol.innerHTML += `
                                <label class="flex items-center space-x-2 cursor-pointer p-2 hover:bg-gray-100 rounded transition">
                                    <input type="checkbox" name="colecao" value="${col}" class="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500">
                                    <span class="text-sm font-medium text-gray-700 truncate" title="${col}">${col}</span>
                                </label>
                            `;
                        });
                        containerDest.classList.remove('hidden');
                        containerBtn.classList.remove('hidden');
                    } else {
                        alert("Erro ao buscar tabelas: " + data.message);
                    }
                })
                .catch(err => alert("Erro de conexão."));
        }

        function marcarTodas() {
            const checkboxes = document.querySelectorAll('input[name="colecao"]');
            let todasMarcadas = true;
            
            checkboxes.forEach(cb => { if (!cb.checked) todasMarcadas = false; });
            checkboxes.forEach(cb => { cb.checked = !todasMarcadas; });
        }

        function executarClone() {
            const dbOrigem = document.getElementById('db_origem').value;
            const dbDestino = document.getElementById('db_destino').value.trim();
            const btn = document.getElementById('btn_clonar');
            
            const checkboxes = document.querySelectorAll('input[name="colecao"]:checked');
            const colecoesSelecionadas = Array.from(checkboxes).map(cb => cb.value);

            if (!dbDestino) { alert("Por favor, informe o nome do novo banco de dados."); return; }
            if (dbOrigem === dbDestino) { alert("A origem e o destino não podem ter o mesmo nome."); return; }
            if (colecoesSelecionadas.length === 0) { alert("Selecione pelo menos uma tabela para copiar."); return; }

            if (!confirm(`Confirma a clonagem de ${colecoesSelecionadas.length} tabelas para o banco '${dbDestino}'?`)) return;

            // Muda estado do botão
            const btnHtmlOriginal = btn.innerHTML;
            btn.innerHTML = '⏳ Copiando Dados... Por favor, não feche a página.';
            btn.disabled = true;
            btn.classList.replace('bg-indigo-600', 'bg-gray-400');
            btn.classList.remove('hover:bg-indigo-700');

            fetch('/api/executar_clone', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    db_origem: dbOrigem,
                    db_destino: dbDestino,
                    colecoes: colecoesSelecionadas
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert("🎉 Sucesso!\n" + data.message);
                    document.getElementById('db_destino').value = '';
                    // Opcional: Recarregar a página para o novo banco aparecer na origem
                    window.location.reload(); 
                } else {
                    alert("⚠️ Erro: " + data.message);
                }
            })
            .catch(err => {
                alert("Erro grave na conexão ao clonar.");
            })
            .finally(() => {
                // Restaura o botão
                btn.innerHTML = btnHtmlOriginal;
                btn.disabled = false;
                btn.classList.replace('bg-gray-400', 'bg-indigo-600');
                btn.classList.add('hover:bg-indigo-700');
            });
        }
    </script>
</body>
</html>
