<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Comissões</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F3F4F6; }
        .input-group label { display: block; font-size: 0.75rem; font-weight: 700; color: #6B7280; text-transform: uppercase; margin-bottom: 0.25rem; }
        .input-group input { width: 100%; padding: 0.5rem; border: 1px solid #D1D5DB; border-radius: 0.375rem; outline: none; transition: border-color 0.2s; }
        .input-group input:focus { border-color: #10B981; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="p-6">

    <div class="max-w-4xl mx-auto">
        <div class="bg-emerald-600 text-white p-6 rounded-t-xl shadow-md flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold">Simulador Financeiro</h1>
                <p class="text-emerald-100 text-sm">Previsão de Ganhos e Comissões</p>
            </div>
            <div class="text-4xl">📊</div>
        </div>

        <div class="bg-white p-6 rounded-b-xl shadow-md border border-t-0 border-gray-200">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <h2 class="text-lg font-black text-gray-800 mb-4 border-b pb-2">1. Definir Parâmetros</h2>
                    
                    <div class="grid grid-cols-3 gap-3 mb-6 bg-gray-50 p-3 rounded-lg border border-gray-200">
                        <div class="input-group">
                            <label>Taxa Direta (%)</label>
                            <input type="number" id="taxaDireta" value="15" step="0.1" oninput="calcular()">
                        </div>
                        <div class="input-group">
                            <label>Taxa Ind. A (%)</label>
                            <input type="number" id="taxaIndA" value="5" step="0.1" oninput="calcular()">
                        </div>
                        <div class="input-group">
                            <label>Taxa Ind. B (%)</label>
                            <input type="number" id="taxaIndB" value="10" step="0.1" oninput="calcular()">
                        </div>
                    </div>

                    <h2 class="text-lg font-black text-gray-800 mb-4 border-b pb-2">2. Volume Movimentado (R$)</h2>
                    
                    <div class="space-y-4">
                        <div class="input-group relative">
                            <label>Volume Venda Direta R$ </label>
                            <input type="number" id="volDireta" value="1000" oninput="calcular()" class="pl-8 font-bold text-gray-700">
                            <span class="absolute left-3 top-7 text-gray-400 font-bold"></span>
                        </div>
                        <div class="input-group relative">
                            <label>Volume Indireta A (Passiva) R$ </label>
                            <input type="number" id="volIndA" value="500" oninput="calcular()" class="pl-8 font-bold text-gray-700">
                            <span class="absolute left-3 top-7 text-gray-400 font-bold"></span>
                        </div>
                        <div class="input-group relative">
                            <label>Volume Indireta B (Balcão) R$ </label>
                            <input type="number" id="volIndB" value="300" oninput="calcular()" class="pl-8 font-bold text-gray-700">
                            <span class="absolute left-3 top-7 text-gray-400 font-bold"></span>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-50 p-5 rounded-xl border border-gray-200 flex flex-col">
                    <h2 class="text-lg font-black text-gray-800 mb-4 border-b pb-2">Resultados Simulados</h2>
                    
                    <div class="grid grid-cols-2 gap-3 mb-6">
                        <div class="bg-white p-3 rounded shadow-sm border-l-4 border-emerald-500">
                            <p class="text-[10px] text-gray-500 font-bold uppercase">Comissão Direta</p>
                            <p class="text-lg font-black text-emerald-700" id="resDireta">R$ 0,00</p>
                        </div>
                        <div class="bg-white p-3 rounded shadow-sm border-l-4 border-blue-500">
                            <p class="text-[10px] text-gray-500 font-bold uppercase">Indireta A (Passiva)</p>
                            <p class="text-lg font-black text-blue-700" id="resIndA">R$ 0,00</p>
                        </div>
                        <div class="bg-white p-3 rounded shadow-sm border-l-4 border-purple-500">
                            <p class="text-[10px] text-gray-500 font-bold uppercase">Indireta B (Balcão)</p>
                            <p class="text-lg font-black text-purple-700" id="resIndB">R$ 0,00</p>
                        </div>
                        <div class="bg-gray-800 p-3 rounded shadow-sm">
                            <p class="text-[10px] text-gray-300 font-bold uppercase">Total a Receber</p>
                            <p class="text-xl font-black text-white" id="resTotal">R$ 0,00</p>
                        </div>
                    </div>

                    <div class="flex-grow bg-white p-2 rounded border border-gray-200">
                        <canvas id="graficoComissoes"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Formataador de Moeda
        const formatarMoeda = (valor) => {
            return valor.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        // Inicializa o Gráfico Chart.js
        const ctx = document.getElementById('graficoComissoes').getContext('2d');
        let chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Direta', 'Indireta A', 'Indireta B'],
                datasets: [{
                    label: 'Comissão Gerada (R$)',
                    data: [0, 0, 0],
                    backgroundColor: ['#10B981', '#3B82F6', '#8B5CF6'],
                    borderWidth: 0,
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: { beginAtZero: true, ticks: { callback: function(value) { return 'R$ ' + value; } } }
                }
            }
        });

        // Função Principal de Cálculo
        function calcular() {
            // 1. Ler Taxas
            const tDir = parseFloat(document.getElementById('taxaDireta').value) || 0;
            const tIndA = parseFloat(document.getElementById('taxaIndA').value) || 0;
            const tIndB = parseFloat(document.getElementById('taxaIndB').value) || 0;

            // 2. Ler Volumes
            const vDir = parseFloat(document.getElementById('volDireta').value) || 0;
            const vIndA = parseFloat(document.getElementById('volIndA').value) || 0;
            const vIndB = parseFloat(document.getElementById('volIndB').value) || 0;

            // 3. Matemática
            const cDir = vDir * (tDir / 100);
            const cIndA = vIndA * (tIndA / 100);
            const cIndB = vIndB * (tIndB / 100);
            const total = cDir + cIndA + cIndB;

            // 4. Atualizar Textos na Tela
            document.getElementById('resDireta').innerText = 'R$ ' + formatarMoeda(cDir);
            document.getElementById('resIndA').innerText = 'R$ ' + formatarMoeda(cIndA);
            document.getElementById('resIndB').innerText = 'R$ ' + formatarMoeda(cIndB);
            document.getElementById('resTotal').innerText = 'R$ ' + formatarMoeda(total);

            // 5. Atualizar Gráfico
            chart.data.datasets[0].data = [cDir, cIndA, cIndB];
            chart.update();
        }

        // Executar a primeira vez ao carregar a página
        window.onload = calcular;
    </script>
</body>
</html>
