<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Seleção de Evento - Financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">📊 Selecione o Evento para Fechamento</h1>
            <a href="{{ url_for('submenu_eventos') }}" class="text-blue-600 hover:underline">← Voltar</a>
        </div>

        {% if request.args.get('error') %}
            <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4">{{ request.args.get('error') }}</div>
        {% endif %}

        <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
            {% for e in eventos %}
            <a href="{{ url_for('financeiro_evento', id_evento=e.id_evento) }}" 
               class="block bg-white p-4 rounded-lg shadow hover:shadow-md transition border-l-4 {% if e.status=='ativo' %}border-green-500{% elif e.status=='finalizado' %}border-gray-500{% else %}border-yellow-500{% endif %}">
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-xs font-bold uppercase text-gray-500">{{ e.status }}</span>
                        <h3 class="text-lg font-bold text-gray-800">{{ e.descricao }}</h3>
                        <p class="text-sm text-gray-600">📅 {{ e.data_fmt }} - 🕒 {{ e.hora_evento }}</p>
                    </div>
                    <div class="text-right">
                         <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded">ID: {{ e.id_evento }}</span>
                    </div>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>
</body>
</html>
