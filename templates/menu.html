<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de Operações</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h4 class="text-sm mt-2">Olá, {{ logado }} </h4>
        <h2>🎯 Menu de Operações</h2>
        {% if error %}
            <div style="background-color: #FEE2E2; color: #991B1B; padding: 6px; border: 1px solid #FCA5A5; border-radius: 8px; margin-bottom: 10px; text-align: center; font-weight: bold;">
                {{ error }}
            </div>
        {% endif %}
        <a href="{{ url_for('nova_venda') }}" class="menu-item menu-item-venda">⭐ Nova Venda</a>
        <a href="{{ url_for('consulta_status_eventos', mode='simple') }}" class="menu-item">🗓️ Consulta de Eventos Ativos</a>
        <a href="{{ url_for('consulta_vendas') }}" class="menu-item">
             <span class="emoji">📊</span>
             <span class="menu-text">Consultar Vendas</span>
        </a>
        <a href="{{ url_for('consulta_resultados') }}" class="menu-item">🏆 Consulta de Resultados</a>
        <a href="{{ url_for('cadastro_cliente', view='novo', next='menu_operacoes') }}" class="menu-item">👥 Cadastro de Clientes</a>
        <a href="{{ url_for('minha_conta', view='novo', next='menu_operacoes') }}" class="menu-item">🛠️ Minha Conta</a>
       
        {% if nivel >= 3 %} 
            <hr class="my-0 ">

             <a href="{{ url_for('submenu_eventos') }}" class="menu-item gerencial-item">
                 🎉 Menu Eventos
            </a>
            <a href="{{ url_for('cadastro_colaborador', view='listar') }}" class="menu-item gerencial-item">
                 🛠️ Cadastro de Colaboradores
            </a>
        {% endif %}
        
        <a href="{{ url_for('login_page') }}" class="-mt-10 menu-item menu-item-exit">🚪 Sair</a>
    </div>
</body>
</html>
