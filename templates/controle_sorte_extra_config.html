<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração Sorte Extra 🍀</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .purple-gradient { background: linear-gradient(135deg, #6b21a8 0%, #4c1d95 100%); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-12">

    <!-- Header -->
    <div class="purple-gradient text-white py-2 shadow-lg mb-2">
        <div class="max-w-5xl mx-auto px-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="bg-white/20 p-1 rounded-full">
                        <span class="text-3xl">🍀</span>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold uppercase tracking-tight">Sorte Extra</h1>
                        <p class="text-purple-100 text-sm">Configuração de Parâmetros e Regras</p>
                    </div>
                </div>
                <a href="{{ url_for('submenu_eventos') }}" class="bg-white/10 hover:bg-white/20 border border-white/30 px-6 py-2 rounded-lg transition-all text-sm font-semibold">
                    ← Voltar ao Menu
                </a>
            </div>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-4">
        
        <!-- Alertas de Sucesso/Erro -->
        {% if success %}
        <div class="bg-green-100 border-l-4 border-green-500 text-green-700 p-2 rounded shadow-sm mb-2 flex items-center gap-3">
            <span class="text-xl">✅</span>
            <p class="font-medium">{{ success }}</p>
        </div>
        {% endif %}

        {% if error %}
        <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-2 rounded shadow-sm mb-2 flex items-center gap-3">
            <span class="text-xl">⚠️</span>
            <p class="font-medium">{{ error }}</p>
        </div>
        {% endif %}

        <form action="{{ url_for('salvar_config_sorte_extra') }}" method="POST">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- Coluna da Esquerda: Evento e Básicos -->
                <div class="lg:col-span-2 space-y-4">
                    
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200">
                        <h2 class="text-lg font-bold text-gray-800 mb-2 flex items-center gap-2 border-b pb-2">
                            <span class="text-purple-600">01</span> Vínculo do Evento
                        </h2>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">ID do Evento Alvo</label>
                                <select name="id_evento" id="id_evento" required 
                                    class="w-full bg-gray-50 border border-gray-300 rounded-lg p-3 text-gray-700 focus:ring-2 focus:ring-purple-500 outline-none transition-all">
                                    <option value="">Selecione o Evento...</option>
                                    {% for ev in eventos %}
                                    <option value="{{ ev.id_evento }}" 
                                            data-info="{{ ev.descricao }} - {{ ev.data_evento }} {{ ev.hora_evento }}"
                                            {% if config and config.id_evento == ev.id_evento %}selected{% endif %}>
                                        ID {{ ev.id_evento }} - {{ ev.descricao }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="space-y-2">
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Dados do Evento (Display)</label>
                                <input type="text" id="display_evento" name="data_hora_evento" 
                                    value="{{ config.data_hora_evento if config else '' }}" 
                                    readonly 
                                    class="w-full bg-gray-100 border border-gray-200 rounded-lg p-3 text-gray-500 font-medium italic outline-none cursor-not-allowed">
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200">
                        <h2 class="text-lg font-bold text-gray-800 mb-2 flex items-center gap-2 border-b pb-2">
                            <span class="text-purple-600">02</span> Parâmetros da Promoção
                        </h2>
                        
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="space-y-2">
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Qtd Dezenas por Cupom</label>
                                <input type="number" name="qtde_dezenas" value="{{ config.qtde_dezenas if config else 5 }}" required
                                    class="w-full bg-gray-50 border border-gray-300 rounded-lg p-1 focus:ring-2 focus:ring-purple-500 outline-none text-center font-bold text-lg">
                            </div>
                            
                            <div class="space-y-2">
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Qtde a Sortear (Tope)</label>
                                <input type="number" name="qtde_tope_sorte_extra" value="{{ config.qtde_tope_sorte_extra if config else 10 }}" required
                                    class="w-full bg-gray-50 border border-gray-300 rounded-lg p-1 focus:ring-2 focus:ring-purple-500 outline-none text-center font-bold text-lg">
                            </div>

                            <div class="space-y-2">
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Preço do Cupom (R$)</label>
                                <input type="text" name="preco_cupom" value="{{ config.preco_cupom | format_moeda if config else '0,00' }}" required
                                    class="w-full bg-purple-50 border border-purple-200 rounded-lg p-1 focus:ring-2 focus:ring-purple-500 outline-none text-center font-bold text-lg text-purple-700">
                            </div>
                        </div>
                        
                        <div class="mt-4 space-y-2">
                            <label class="block text-xs font-bold text-gray-800 uppercase tracking-wider">Regras do Jogo e Texto de Vitória</label>
                            <textarea name="texto_regra_vitoria" rows="6" 
                                placeholder="Ex: Acerte 5 dezenas para o prêmio máximo..."
                                class="w-full bg-gray-50 border border-gray-300 rounded-lg p-4 focus:ring-2 focus:ring-purple-500 outline-none resize-none">{{ config.texto_regra_vitoria if config else '' }}</textarea>
                        </div>
                    </div>
                </div>

                <!-- Coluna da Direita: Premiação e Status -->
                <div class="space-y-4">
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200 h-full flex flex-col">
                        <h2 class="text-lg font-bold text-gray-800 mb-2 flex items-center gap-2 border-b pb-2">
                            <span class="text-purple-600">03</span> Tabela de Prêmios
                        </h2>
                        
                        <div class="space-y-2 flex-grow">
                            <div class="space-y-2">
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Prêmio Máximo (5 Dz)</label>
                                <input type="text" name="premio_maximo" value="{{ config.premio_maximo | format_moeda if config else '0,00' }}" 
                                    class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-purple-500 outline-none text-right font-bold text-green-600">
                            </div>
                            
                            <div class="space-y-2">
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Intermediário (4 Dz)</label>
                                <input type="text" name="premio_intermediario" value="{{ config.premio_intermediario | format_moeda if config else '0,00' }}" 
                                    class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-purple-500 outline-none text-right font-bold">
                            </div>

                            <div class="space-y-2">
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Prêmio Base (3 Dz)</label>
                                <input type="text" name="premio_base" value="{{ config.premio_base | format_moeda if config else '0,00' }}" 
                                    class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-purple-500 outline-none text-right font-bold">
                            </div>

                            <div class="space-y-2">
                                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider">Prêmio Mínimo (2 Dz)</label>
                                <input type="text" name="premio_minimo" value="{{ config.premio_minimo | format_moeda if config else '0,00' }}" 
                                    class="w-full border border-gray-300 rounded-lg p-2 focus:ring-2 focus:ring-purple-500 outline-none text-right font-bold">
                            </div>
                        </div>

                        <div class="mt-3 pt-2 border-t space-y-2">
                            <div class="space-y-2">
                                <label class="block text-xs font-bold text-gray-800 uppercase tracking-wider text-center">Status da Promoção</label>
                                <div class="flex p-1 bg-gray-100 rounded-lg">
                                    <label class="flex-1 text-center py-2 cursor-pointer transition-all rounded-md">
                                        <input type="radio" name="status" value="ativo" class="hidden peer" {% if config and config.status == 'ativo' %}checked{% elif not config %}checked{% endif %}>
                                        <div class="peer-checked:bg-green-500 peer-checked:text-white text-gray-500 font-bold text-xs uppercase p-2 rounded-md">Ativo</div>
                                    </label>
                                    <label class="flex-1 text-center py-2 cursor-pointer transition-all rounded-md">
                                        <input type="radio" name="status" value="paralisado" class="hidden peer" {% if config and config.status == 'paralisado' %}checked{% endif %}>
                                        <div class="peer-checked:bg-red-500 peer-checked:text-white text-gray-500 font-bold text-xs uppercase p-2 rounded-md">Paralisado</div>
                                    </label>
                                </div>
                            </div>

                            <button type="submit" class="w-full purple-gradient text-white font-bold py-3 rounded-xl shadow-lg hover:brightness-110 active:scale-95 transition-all uppercase tracking-widest">
                                Salvar Configuração
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </form>
    </div>

    <script>
        // Lógica de Preenchimento Automático da Descrição do Evento
        const selectEvento = document.getElementById('id_evento');
        const displayEvento = document.getElementById('display_evento');

        selectEvento.addEventListener('change', function() {
            const selectedOption = this.options[this.selectedIndex];
            const info = selectedOption.getAttribute('data-info');
            
            if (info) {
                displayEvento.value = info;
            } else {
                displayEvento.value = "";
            }
        });

        // Formatação simples de Moeda nos inputs enquanto digita (opcional)
        // Se desejar adicionar máscaras complexas, recomendo usar IMask ou VanillaMasker.
    </script>

</body>
</html>
